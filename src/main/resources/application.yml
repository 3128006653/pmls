server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/pmls?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  mapper-locations: classpath*:mapper/**/*.xml

logging:
  level:
    com.example1.mapper: debug
jwt:
  secret: ${JWT_SECRET:pmls-demo-only-change-me-32chars-minimum}
  expire-minutes: 120
